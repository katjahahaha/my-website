<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    .wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: white;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* default: desktop full screen */
      position: absolute;
      transition: opacity 0.8s ease;
      cursor: pointer;
    }

    .hidden {
      opacity: 0;
    }

    /* 📱 MOBILE RULE */
    @media (max-width: 768px) {
      img {
        object-fit: contain; /* show whole image */
        background: white;   /* white bars */
      }
    }
  </style>
</head>

<body>

<div class="wrapper">
  <img id="img1" src="Photo1.jpg">
  <img id="img2" src="Photo2.jpg" class="hidden">
</div>

<script>
  const img1 = document.getElementById("img1");
  const img2 = document.getElementById("img2");

  let showingFirst = true;

  function toggle() {
    if (showingFirst) {
      img1.classList.add("hidden");
      img2.classList.remove("hidden");
    } else {
      img2.classList.add("hidden");
      img1.classList.remove("hidden");
    }
    showingFirst = !showingFirst;
  }

  img1.addEventListener("click", toggle);
  img2.addEventListener("click", toggle);
</script>

</body>
</html>
