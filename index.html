<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      cursor: pointer;
      display: block;
    }
  </style>
</head>

<body>

<img id="photo" src="Photo1.jpg">

<script>
  const photo = document.getElementById("photo");

  let first = true;

  photo.addEventListener("click", () => {
    photo.src = first ? "Photo2.jpg" : "Photo1.jpg";
    first = !first;
  });
</script>

</body>
</html>
