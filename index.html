<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Toggle</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

<img id="photo" src="photo1.jpg" alt="Photo">

<script>
  const photo = document.getElementById("photo");

  let isFirst = true;

  photo.addEventListener("click", () => {
    if (isFirst) {
      photo.src = "photo2.jpg";
    } else {
      photo.src = "photo1.jpg";
    }
    isFirst = !isFirst;
  });
</script>

</body>
</html>
