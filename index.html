<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>

<body>

  <img id="photo" src="Photo1.jpg" alt="">

  <script>
    const photo = document.getElementById("photo");

    let showingFirst = true;

    photo.addEventListener("click", () => {
      if (showingFirst) {
        photo.src = "Photo2.jpg";
      } else {
        photo.src = "Photo1.jpg";
      }
      showingFirst = !showingFirst;
    });
  </script>

</body>
</html>
